# G3-E (docs/g3-e0-packaging-contract.md S3): hatchling ADOPT —
# force-include mapea los fixtures congelados al runtime evidence
# bundle del wheel sin duplicarlos en el source tree.
[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "finreg-es"
version = "0.0.1"
description = "Registro unificado y verificable de autorizaciones financieras en Espana (G0)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Tooling/CI only: JSON Schema validation of artifact contracts.
# finreg_es runtime must remain stdlib-only (zero-dep auditability).
tooling = ["jsonschema>=4.21,<5", "hypothesis>=6.100,<7", "mutmut>=3.2,<4", "dictdiffer>=0.9,<0.11"]
# G3-B adapters read-only (docs/g3-b-adapter-contract.md). El core
# sigue instalable con cero runtime deps: estos extras solo cargan
# las superficies, nunca la semantica.
cli = ["typer>=0.26,<0.28"]
mcp = ["mcp>=2,<3"]
adapters = ["typer>=0.26,<0.28", "mcp>=2,<3"]
# G3-C pilot Datasette (docs/g3-c-projection-contract.md): visor
# immutable de la proyeccion SQLite. Linea estable fijada; la alpha
# 1.0 queda fuera del pilot.
datasette = ["datasette==0.65.4"]

# G3-E S7: console script via shim stdlib-only — el wheel base
# (dependencies=[]) no deja un ejecutable roto; sin typer emite un
# error estructurado indicando el extra.
[project.scripts]
finreg = "adapters.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# E6-A quality probe: mutation testing scoped a la semantica del
# motor. Tooling-only; el runtime core sigue stdlib-only. Requiere
# Linux/WSL (mutmut no soporta Windows nativo).
[tool.mutmut]
source_paths = ["finreg_es/semantics.py", "finreg_es/temporal.py", "finreg_es/coverage.py"]
also_copy = ["finreg_es", "fixtures", "schemas", "tools"]
pytest_add_cli_args_test_selection = ["tests/g1", "tests/semantics", "tests/coverage", "tests/g07", "tests/identity"]
pytest_add_cli_args = ["-x", "-q"]

# G3-E S4: wheel puro = finreg_es + adapters + runtime evidence
# bundle. force-include copia byte-for-byte los ORIGINALES del repo
# a adapters/_data/fixtures/ dentro del wheel — cero copias
# versionadas en el source tree.
[tool.hatch.build.targets.wheel]
packages = ["adapters", "finreg_es"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/contracts" = "adapters/_data/fixtures/contracts"
"fixtures/g1/derived-assertions-g1-e-002.json" = "adapters/_data/fixtures/g1/derived-assertions-g1-e-002.json"
"fixtures/g2/events" = "adapters/_data/fixtures/g2/events"
"fixtures/g3/projection" = "adapters/_data/fixtures/g3/projection"
