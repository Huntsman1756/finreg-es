task_id: g3-d-preregister
kind: preregistration
status: ready
lifecycle: oneshot
skill: preregister-gate

goal: >-
  Congelar el contrato del smoke externo black-box de G3-D
  (docs/g3-d-external-smoke-contract.md) antes de implementarlo.
  Cero codigo: la salida es el documento con las reglas D1-D4, la
  cadena de escenarios S1-S5, el harness permitido, los acceptance
  criteria y los veredictos validos declarados.

inputs:
  surfaces: >-
    python -m adapters.cli (CLI Typer) · python -m
    adapters.mcp_server (MCP stdio v2) · datasette serve -i
    fixtures/g3/projection/finreg-g3.sqlite (visor immutable)
  contracts: >-
    docs/g3-b-adapter-contract.md · docs/g3-c-projection-contract.md

gate:
  - docs/g3-scope.md
  - docs/g3-a-oss-scan-surfaces.md
  - docs/g3-b-adapter-contract.md
  - docs/g3-c-projection-contract.md

constraints:
  no_production_code: true
  g3d_not_g3e: >-
    el smoke prueba el checkout actual; instalacion, wheel, console
    scripts y ejecutable `finreg` son packaging de G3-E, fuera de
    alcance aqui.
  black_box: >-
    el cliente no importa finreg_es.*, adapters.* ni abre el
    .sqlite con sqlite3; interactua solo por CLI subprocess, MCP
    client estandar por stdio y HTTP/JSON Datasette.
  no_surface_changes: >-
    ninguna superficie (cli/mcp/datasette/proyeccion) se modifica
    para que el smoke pase; si la superficie publica no basta, el
    veredicto es QUALIFIED/FAIL, no un parche.

questions_falsables:
  - >-
    ¿Puede un consumidor black-box recorrer desde una respuesta
    hasta su evidencia oficial (assertion -> source_assertions ->
    snapshot sha/url/retrieved_at) cruzando CLI/MCP/Datasette sin
    conocer internals?
  - >-
    ¿Son las superficies coherentes entre si (mismo payload
    canonico CLI==MCP; ids emitidos por una superficie resolubles
    en otra) y fail-closed observables desde fuera?

expected:
  doc: docs/g3-d-external-smoke-contract.md
  acceptance_criteria: >-
    cadena S1-S5 preregistrada (assessment bitemporal real -> parity
    CLI/MCP -> drill-down Datasette por used_assertion_id -> cambio
    BLOCKED navegable entre superficies -> error fail-closed
    observable); veredictos validos declarados
    (PASS/QUALIFIED/FAIL) antes de observar resultados.
  full_suite: PASS

evidence_required: >-
  contrato publicado y commiteado antes de escribir el harness; la
  task g3-d-external-smoke solo puede existir ready cuando el
  contrato ya este en el repo.

notes: >-
  El harness sera tools/smoke_g3d_external.py + un wrapper pytest
  que lo ejecuta como proceso y verifica estructuralmente la
  prohibicion de imports (D1). Datasette/MCP se consumen como
  procesos/protocolo, nunca por import.
