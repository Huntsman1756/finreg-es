task_id: p1-preregister
kind: preregistration
status: done
lifecycle: oneshot
skill: preregister-gate

goal: >-
  Congelar docs/p1-scope.md: fase corta de presentacion publica
  (portfolio polish) del sistema ya cerrado en G3 — README actual,
  quickstart reproducible, ejemplos reales con hash, diagrama de
  arquitectura. P1-E GitHub Release queda preregistrado como task
  OPCIONAL e independiente, sin PyPI. Cero produccion: la salida
  es el scope documento y las tasks sucesoras.

gate:
  - docs/G3-FINAL-REPORT.md
  - docs/g3-scope.md
  - docs/g3-e0-packaging-contract.md

constraints:
  no_production_code: true
  presentation_only: >-
    P1 es presentacion del sistema cerrado; no es una fase de
    ingenieria ni reabre G3. Un fallo del quickstart es un finding
    documentado de P1, nunca un fix dentro de P1.
  no_fake_examples: >-
    todo ejemplo se captura de una ejecucion real del sistema
    congelado (tag g3-consumability-closed); canonical JSON exacto
    + sha256(stdout), nunca inventado ni "simplificado".

expected:
  doc: docs/p1-scope.md
  acceptance_criteria: >-
    tesis, workstreams P1-A..P1-E (E opcional/independiente),
    restricciones vinculantes, criterios de cierre y resultados
    validos declarados antes de ejecutar.
  full_suite: PASS

evidence_required: >-
  scope publicado y commiteado antes de tocar README/ejemplos; la
  task p1-portfolio-polish solo puede existir ready cuando el scope
  ya este en el repo.

notes: >-
  Sin tag para P1 (portfolio polish, no capacidad nueva): un commit
  de cierre basta. P1-E, si recibe GO, es su propia task con su
  propia evidencia.
