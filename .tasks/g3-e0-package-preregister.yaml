task_id: g3-e0-package-preregister
kind: preregistration
status: done
lifecycle: oneshot
skill: preregister-gate

goal: >-
  Congelar el contrato de packaging de G3-E
  (docs/g3-e0-packaging-contract.md) antes de implementarlo:
  runtime evidence bundle dentro del wheel, micro-scan OSS de
  backend de build, resolucion de paths en adapters/, entrypoint
  stdlib-only y acceptance criteria del install smoke. Cero codigo
  de produccion.

inputs:
  surfaces: >-
    finreg_es/ + adapters/ + bundle minimo de artefactos congelados
    (contracts, derived-assertions-g1-e-002, g2/events,
    g3/projection)
  failure: >-
    adapters/common.py resuelve ROOT=parents[1]; en un wheel
    instalado eso es site-packages — sin bundle explicito el
    paquete instala pero falla al cargar evidence set/contracts/
    events. pyproject no tiene [build-system] ni [project.scripts].

gate:
  - docs/g3-scope.md
  - docs/g3-a-oss-scan-surfaces.md
  - docs/g3-b-adapter-contract.md
  - docs/g3-c-projection-contract.md
  - docs/g3-d-external-smoke-contract.md

constraints:
  no_production_code: true
  no_pypi_publish: >-
    construir e instalar el wheel local demuestra el gate; subirlo
    a un registry es distribucion, no consumibilidad — fuera de
    alcance.
  byte_equality: >-
    sha256(fixture en repo) == sha256(en wheel) == sha256(instalado);
    evidence_set_id y logical_projection_sha256 deben sobrevivir la
    instalacion byte-exactos.
  entrypoint_stdlib_only: >-
    el console script apunta a un shim stdlib-only que delega en
    adapters.cli si typer esta presente y falla con error
    estructurado "instale finreg-es[cli]" si no — project.dependencies
    permanece vacio.

questions_falsables:
  - >-
    ¿Puede un wheel puro instalado en un venv limpio fuera del
    checkout responder con exactamente los mismos artefactos,
    hashes y veredictos que el repo?
  - >-
    ¿Que backend de build resuelve incluir los artefactos
    congelados en el wheel sin duplicarlos en el source tree
    (fallo concreto a medir)?

expected:
  doc: docs/g3-e0-packaging-contract.md
  acceptance_criteria: >-
    scan de backend (hatchling/setuptools/flit-core/pdm-backend/
    uv-build) con decision documentada; bundle minimo congelado;
    regla de resolucion de paths; propiedad byte-equality;
    entrypoint spec; criterios E1 (build x2, venv limpio, extras,
    evidence_set_id, logical digest, cero dependencia del
    checkout); veredictos validos PASS/QUALIFIED/FAIL declarados.
  full_suite: PASS

evidence_required: >-
  contrato publicado y commiteado antes de tocar pyproject,
  adapters/ o CI; la task g3-e1-package-build solo puede existir
  ready cuando el contrato ya este en el repo.

notes: >-
  G3-E en tres pasos: E0 contrato+scan (esta task), E1
  build/install smoke, E2 audit + FINAL-REPORT + scope CLOSED +
  tag g3-consumability-closed. Expectativa registrada NO
  vinculante: hatchling probablemente ADOPT (force-include +
  reproducible builds) — el scan decide.
