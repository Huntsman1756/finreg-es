task_id: p1-e-github-release
kind: gate-execution
status: ready
lifecycle: oneshot
skill: run-gate

blocker: >-
  Task OPCIONAL e independiente de P1: no es condicion de cierre.
  Requiere p1-portfolio-polish done + GO explicito del owner.
  Publicar un GitHub Release es un efecto real publico; sin PyPI.

goal: >-
  Crear un GitHub Release sobre un commit/tag verificado: notas
  enlazables a los FINAL-REPORT, wheel + sdist como artifacts con
  sha256 publicados. Sin PyPI, sin bump de version sin GO.

gate:
  - docs/p1-scope.md
  - docs/G3-FINAL-REPORT.md

expected:
  acceptance: >-
    release artifacts construidos desde commit verificado; sha256
    de wheel/sdist publicados; notas consistentes con los
    FINAL-REPORT; cero claims no reproducibles.
  full_suite: PASS

notes: >-
  Si se decide release publico con version real/PyPI, eso es una
  fase de distribution nueva con su propio preregistro — no esta
  task.
