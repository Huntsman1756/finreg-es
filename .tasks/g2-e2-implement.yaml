task_id: g2-e2-implement
kind: gate-execution
status: ready
lifecycle: oneshot
skill: run-gate
goal: >-
  Implementar AssessmentQuery(valid_at, known_at) como una capa
  bitemporal fina sobre ASSESSMENT_SEMANTICS_V3: filtrar evidencia
  por known_at y delegar el assessment juridico integramente en V3
  con as_of=valid_at.
inputs:
  evidence_set: fixtures/g1/derived-assertions-g1-e-002.json
  corpus: fixtures/g1/corpus-g1-e-001.json
  claim_ledger: fixtures/g1/claim-ledger-g1-e-001.json
  contracts: fixtures/contracts/
gate:
  - docs/g2-e1-bitemporal-assessment-contract.md
  - fixtures/g2/e0/bitemporal-cases.json
constraints:
  assessment_semantics_v3_unchanged: true
  no_parallel_temporal_engine: true
  no_effective_interval_mutation: true
  known_at_filters_evidence_only: true
  evidence_set_frozen: true
  runtime_stdlib_only: true
expected:
  tests: tests/g2/test_g2e_*.py
  probes: >-
    18/18 probes de fixtures/g2/e0/bitemporal-cases.json
    (FINREG_G2_E0_CASES_V1) reproducidos integros:
    expected_assessment, expected_reason, usable/excluded_after_K,
    used_assertion_ids y diagnostics.
  metamorphic: >-
    K creciente => usable nunca decrece (assessment no tiene por que
    ser monotono); mismo (T,K) => resultado determinista; cambiar K
    nunca muta effective_from/to ni intervals; evidencia con
    retrieved_at > K nunca aparece en used_assertion_ids; evidencia
    sin provenance temporal excluida fail-closed + diagnostico;
    K posterior a toda la evidencia del evidence_set => mismo
    resultado que V3 directo sobre ese evidence_set (capa
    transparente).
  full_suite: PASS
evidence_required: >-
  finreg_es/bitemporal.py (stdlib-only) + tests/g2/test_g2e_*.py que
  reproducen los 18 probes y los metamorficos preregistrados, sin
  tocar semantics.py, derivation.py ni temporal.py.
notes: >-
  known_at NO es versionado historico del software: V3 congelado se
  usa para todos los probes (otra dimension, otro proyecto). La
  proyeccion retrieved_at -> fecha calendario acepta date y datetime
  ISO (E1-R4); max(retrieved_at) de source_assertions es el gate
  (E1-R1); un item sin source_assertions no es observable en ningun
  K y genera diagnostico (E1-R2). evidence_set_id se liga a los
  bytes del artefacto consumido (<stem>@sha256:<file-bytes>), como
  congela el contrato E1.
