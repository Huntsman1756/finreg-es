task_id: p1-portfolio-polish
kind: gate-execution
status: done
lifecycle: oneshot
skill: run-gate

goal: >-
  Ejecutar docs/p1-scope.md workstreams P1-A..P1-D: README actual
  (tesis + capacidades G0-G3 + limites), quickstart reproducible
  (checkout del tag -> build wheel -> venv limpio -> install ->
  finreg --help -> query real verificable), 2-3 ejemplos reales en
  docs/examples/ con sha256(stdout), diagrama de arquitectura.
  P1-E GitHub Release NO esta en esta task.

gate:
  - docs/p1-scope.md
  - docs/G3-FINAL-REPORT.md
  - docs/g3-e0-packaging-contract.md

constraints:
  core_frozen: true
  no_adapter_semantics_changes: true
  no_fake_examples: >-
    todo output en docs/examples/ se captura de una ejecucion real
    sobre el tag g3-consumability-closed; canonical JSON exacto +
    sha256(stdout) documentados; si el README muestra un extracto
    lo declara y enlaza al completo.
  no_pypi: true
  friction_is_finding: >-
    si el quickstart revela friccion real del producto, se
    documenta como finding — no se arregla dentro de P1.

expected:
  files:
    - README.md (actualizado)
    - docs/examples/* (outputs reales + manifiesto de reproduccion)
    - docs/p1-* (evidencia/findings si los hay)
  acceptance: >-
    quickstart ejecutado desde limpio; outputs regenerados
    byte-identicos con hashes; README consistente con
    G3-FINAL-REPORT; diagrama sin capacidades inexistentes; enlaces
    validos; suite completa + replay G2-F verdes; G3 congelado.
  full_suite: PASS

evidence_required: >-
  veredicto PASS/QUALIFIED/FAIL segun scope; sha256 de cada
  ejemplo; constancia de que el quickstart se ejecuto de verdad.
