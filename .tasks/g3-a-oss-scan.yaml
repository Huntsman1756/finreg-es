task_id: g3-a-oss-scan
kind: evaluation
status: ready
lifecycle: oneshot
skill: oss-scan
goal: >-
  Scan OSS failure-driven de query surfaces para exponer el core
  FinReg (assess, assess_bitemporal, evidencia, provenance, cambios
  longitudinales) mediante interfaces read-only estables.
inputs:
  scope: docs/g3-scope.md
gate:
  - docs/g3-scope.md
  - docs/adr-oss-scan-failure-driven.md
constraints:
  core_stdlib_only: >-
    finreg_es/ permanece stdlib-only; lo adoptado vive en
    extras/adapters, nunca importado por el core.
  adapters_no_semantics: >-
    UI/API/MCP/CLI nunca contienen semantica regulatoria: llaman al
    core y serializan resultados.
  read_only: true
  offline_deterministic: true
  no_production_code: >-
    el scan produce una decision documental medida, no un adapter.
expected:
  doc: docs/g3-a-oss-scan-surfaces.md
  per_candidate: >-
    licencia, mantenimiento, tests, arquitectura, offline/
    determinismo, encaje medido contra los 5 casos reales del scope.
  decision: >-
    ADOPT | WRAP | PORT_PATTERN | REFERENCE | REJECT por candidato,
    con la medicion.
  full_suite: PASS
evidence_required: >-
  medicion contra los 5 casos reales (assessment actual, bitemporal,
  evidence_set+source_assertions, explicacion BLOCKED/INDETERMINATE,
  cambio longitudinal), no contra el README del candidato.
notes: >-
  La expectativa previa de g3-scope.md NO es vinculante: el scan
  decide. "ADOPT" aqui significa adoptar en capa adapter/extras;
  finreg_es/ sigue stdlib-only.
