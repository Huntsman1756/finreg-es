task_id: g2-e1-preregister
kind: preregistration
status: ready
lifecycle: oneshot
skill: preregister-gate
goal: >-
  Congelar el contrato de la query bitemporal de G2-E
  (AssessmentQuery con valid_at x known_at ->
  BitemporalAssessmentResult) antes de implementarla. Cero codigo de
  produccion: la salida es el documento de contrato con las reglas
  congeladas, el schema del resultado y los 18 probes E0 convertidos
  en acceptance criteria vinculantes.
inputs:
  e0_cases: fixtures/g2/e0/bitemporal-cases.json
  e0_doc: docs/g2-e0-bitemporal-cases.md
gate:
  - docs/g2-snapshot-history-contract.md
  - docs/g2-e0-bitemporal-cases.md
constraints:
  no_production_code: true
  v3_unchanged: >-
    ASSESSMENT_SEMANTICS_V3, covers(), effective_effect_at(),
    status_intervals [from,to) y la frescura no se modifican;
    valid_at sigue alimentando as_of. known_at solo filtra
    evidencia; no se crea un segundo motor temporal.
  known_at_calendar_date: >-
    K es fecha YYYY-MM-DD; un retrieved_at con hora proyecta a su
    fecha calendario; sub-day transaction ordering queda
    OUT_OF_SCOPE_G2_E1 (version sucesora del contrato, nunca
    reinterpretacion de E0).
  versioned_evidence_universe: >-
    known_at opera sobre un universo de evidencia versionado
    (cadena de derivacion congelada con sha256), no sobre todos los
    raw snapshots que existan en el repo; el resultado registra
    evidence_set_id.
  no_catalog_retrofit: >-
    DER_CHI_ENT_AUT (E0-F02: 276 Active->Inactive + 2
    Inactive->Active) queda fuera de esta task: candidato a
    extension preregistrada futura del catalogo G2-C, ortogonal a
    demostrar valid_at x known_at.
questions_falsables:
  - >-
    ¿Puede FinReg devolver assessment diferente para el mismo
    valid_at cuando cambia known_at, unicamente porque cierta
    evidencia todavia no habia sido observada?
  - >-
    Con el mismo known_at, ¿cambia correctamente la assessment al
    mover valid_at a traves de un intervalo juridico conocido?
expected:
  doc: docs/g2-e1-bitemporal-assessment-contract.md
  acceptance_criteria: >-
    los 18 probes de fixtures/g2/e0/bitemporal-cases.json
    (FINREG_G2_E0_CASES_V1, artifact_sha256 784d489e5d0a…) quedan
    preregistrados integros como binding para la implementacion:
    expected_assessment, expected_reason y conjuntos
    usable/excluded_after_K por probe, sin seleccion.
  full_suite: PASS
evidence_required: >-
  contrato publicado con schema de AssessmentQuery +
  BitemporalAssessmentResult, las 5 reglas congeladas y la tabla
  completa de los 18 probes antes de cualquier implementacion.
notes: >-
  La implementacion posterior (G2-E2) sera una capa fina alrededor
  de V3: filtrar evidencia por K -> llamar a V3 con as_of=valid_at.
  No se reescribe V3.
