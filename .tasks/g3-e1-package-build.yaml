task_id: g3-e1-package-build
kind: gate-execution
status: ready
lifecycle: oneshot
skill: run-gate

goal: >-
  Implementar el packaging preregistrado en
  docs/g3-e0-packaging-contract.md: [build-system] hatchling +
  force-include del runtime evidence bundle, [project.scripts]
  finreg -> adapters/entrypoint.py (shim stdlib-only), resolucion
  de paths en adapters/common.py (explicit > checkout > wheel
  _data) y test de build/install smoke en venv limpio.

gate:
  - docs/g3-e0-packaging-contract.md
  - docs/g3-scope.md
  - docs/g3-b-adapter-contract.md
  - docs/g3-c-projection-contract.md

constraints:
  core_frozen_stdlib_only: true
  bundle_byte_for_byte: true
  entrypoint_stdlib_only: true
  project_dependencies_stay_empty: true
  no_surface_semantics_changes: >-
    adapters/common.py solo gana resolucion de paths; ninguna
    operacion cambia su payload.
  no_pypi_publish: true

expected:
  files:
    - adapters/entrypoint.py
    - tests/g3/test_g3e_packaging.py
    - pyproject.toml ([build-system], [project.scripts], hatch config)
    - adapters/common.py (resolucion bundle)
    - .github/workflows/ci.yml (test job instala backend de build)
  acceptance: >-
    wheel+sdist desde clean checkout; build x2 mismo content
    manifest; venv limpio fuera del repo instala el wheel; import
    finreg_es cero deps; finreg sin [cli] falla limpio indicando el
    extra; con [cli] help + query E0 real; con [mcp] discovery +
    query; evidence_set_id identico; changes sobre events
    incluidos; logical_projection_sha256 conservado; cero
    dependencia del checkout; suite + replay + smoke G3-D verdes.
  full_suite: PASS

evidence_required: >-
  wheel construido e instalado en venv limpio dentro del test;
  sha256 por fichero del bundle comparado repo==wheel==installed;
  veredicto PASS/QUALIFIED/FAIL registrado segun contrato.

notes: >-
  PyPI fuera de alcance. Si hatchling produce el mismo wheel SHA en
  build x2, se registra como evidencia adicional — no es el
  requisito contractual (que es content manifest + per-file
  sha256).
