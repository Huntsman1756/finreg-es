    - adapters/__init__.py
    - adapters/common.py
    - adapters/cli.py
    - adapters/mcp_server.py
    - tests/g3/test_g3b_adapters.py
  acceptance: >-
    5 operaciones reales (assess, assess-bitemporal, evidence,
    explain, changes); payload FinReg canonico identico CLI==MCP;
    test estructural de frontera de imports en finreg_es/; errores
    estructurados fail-closed; MCP stdio descubre superficie; CLI
    help+comandos; suite verde; audit_g2f_replay PASS.
  full_suite: PASS

evidence_required: >-
  adapters/ con facade unico; tests/g3 con parity, frontera
  estructural, fail-closed y smoke stdio; CI test job instala
  extras de adapters.

notes: >-
  Datasette/SQLite queda en G3-C (ADOPT-PILOT). FastAPI sigue
  REFERENCE. El envelope MCP no tiene que ser byte-identico al
  stdout del CLI; el payload FinReg canonico si. mcp>=2,<3 con
  MCPServer v2; typer>=0.26,<0.28.
