task_id: g3-b-adapters
kind: gate-execution
status: ready
lifecycle: oneshot
skill: run-gate

goal: >-
  Implementar las superficies read-only preregistradas en
  docs/g3-b-adapter-contract.md: CLI Typer + MCP stdio sobre un
  unico facade adapters/common.py que llama al core congelado sin
  duplicar ni alterar semantica regulatoria.

gate:
  - docs/g3-b-adapter-contract.md
  - docs/g3-scope.md
  - docs/g3-a-oss-scan-surfaces.md

constraints:
  core_stdlib_only: true
  adapters_no_semantics: true
  read_only_no_writes: true
  mcp_v2_mcpserver_stdio: true
  deps_as_optional_extras: true
  no_datasette_sqlite_in_b: true

expected:
