task_id: g3-c-datasette-pilot
kind: gate-execution
status: done
lifecycle: oneshot
skill: run-gate

goal: >-
  Implementar el pilot preregistrado en
  docs/g3-c-projection-contract.md: builder stdlib
  adapters/sqlite_projection.py que proyecta los artefactos
  congelados a SQLite lossless + manifest de lineage, y smoke
  Datasette immutable que verifica los casos C1-C5 y la auditoria
  read-only.

gate:
  - docs/g3-c-projection-contract.md
  - docs/g3-scope.md
  - docs/g3-a-oss-scan-surfaces.md

constraints:
  core_stdlib_only: true
  builder_stdlib_sqlite3_only: true
  projection_no_semantics: >-
    la proyeccion nunca llama assess(), assess_bitemporal() ni
    derivation; solo serializa objetos fuente a canonical JSON.
  datasette_immutable_readonly: true
  datasette_pinned: datasette==0.65.4
  no_custom_ui_or_plugins: true
  logical_determinism_contract: true

expected:
  files:
    - adapters/sqlite_projection.py
    - fixtures/g3/projection/finreg-g3.sqlite
    - fixtures/g3/projection/manifest.json
    - tests/g3/test_g3c_projection.py
    - tests/g3/test_g3c_datasette_smoke.py
  acceptance: >-
    casos C1-C5 resueltos o veredicto PASS/QUALIFIED/FAIL
    registrado; payload_json round-trip lossless; logical digest
    reproducible en build x2; Datasette -i smoke con sha256
    inalterado antes/despues; frontera de imports intacta; full
    suite verde; tools/audit_g2f_replay.py PASS.
  full_suite: PASS

evidence_required: >-
  proyeccion + manifest commiteados como artefacto derivado
  reconstruible; extra `datasette` fijado en pyproject; CI job test
  lo instala (dependencia ausente = fallo, no skip); tests de
  lossless, digest reproducible y auditoria read-only.

notes: >-
  El pilot puede cerrar PASS / QUALIFIED / FAIL — los tres son
  resultados validos preregistrados en el contrato. Datasette sigue
  siendo visor, nunca autoridad ni motor; FastAPI sigue REFERENCE.
