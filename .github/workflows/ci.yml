name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
        with:
          # Historia completa: freeze_commit_time de los facets
          # OpenLineage sale de `git log -1 --format=%cI -- <file>`.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala tooling de tests (runtime core = stdlib-only)
        # typer/mcp solo los usan los tests de adapters/ (G3-B),
        # datasette el smoke del pilot G3-C y build+hatchling el
        # packaging E1; finreg_es/ sigue stdlib-only — hay un test
        # estructural que lo verifica.
        run: python -m pip install ".[test]"

      - name: Verifica dependencias instaladas
        run: python -m pip check

      - name: Suite completa (offline, determinista)
        run: python -m pytest -ra

      - name: Export OpenLineage regenera byte-idéntico
        run: |
          python -m finreg_es.openlineage_export
          test -z "$(git status --porcelain -- openlineage/)"

  oracles:
    # Oráculos OSS (Hypothesis + dictdiffer): garantía CI real, no
    # opcional. Si la dependencia falta, el job falla — no se acepta
    # un skip silencioso como evidencia.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instala oráculos de tooling (runtime core = stdlib-only)
        run: |
          python -m pip install "jsonschema>=4.21,<5" pytest \
            "hypothesis>=6.100,<7" "dictdiffer>=0.9,<0.11"
          python -c "import hypothesis, dictdiffer"

      - name: Property tests + differential oracle
        run: |
          python -m pytest tests/g1/test_g1e_v3_properties.py \
            tests/g2/test_g2b_oracles.py -v
