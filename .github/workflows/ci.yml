name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instala tooling de tests (runtime core = stdlib-only)
        run: python -m pip install "jsonschema>=4.21,<5" pytest

      - name: Suite completa (offline, determinista)
        run: python -m pytest

      - name: Export OpenLineage regenera byte-idéntico
        run: |
          python -m finreg_es.openlineage_export
          test -z "$(git status --porcelain -- openlineage/)"
